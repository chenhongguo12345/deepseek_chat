<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek 结构化对话</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 720px;
            height: 80vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .chat-header {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 24px;
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #4ade80; box-shadow: 0 0 8px #4ade80;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #f7f7fa;
        }
        .msg {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }
        .msg.user { align-self: flex-end; align-items: flex-end; }
        .msg.ai { align-self: flex-start; align-items: flex-start; }
        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
        }
        .msg.user .bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.ai .bubble {
            background: white;
            color: #1a1a1a;
            border: 1px solid #e5e5ea;
            border-bottom-left-radius: 4px;
        }
        .meta {
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 12px;
        }
        .tag {
            background: #eef2ff;
            color: #4f46e5;
            padding: 3px 9px;
            border-radius: 10px;
            border: 1px solid #c7d2fe;
        }
        .tag.intent { background: #fef3c7; color: #92400e; border-color: #fde68a; }
        .tag.confidence { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .tag.keywords { background: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
        .tag.error { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
        .raw-json {
            margin-top: 8px;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 11px;
            background: #1e293b;
            color: #94a3b8;
            padding: 8px 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            max-height: 120px;
            overflow-y: auto;
        }
        .chat-input {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #e5e5ea;
            display: flex;
            gap: 12px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e5ea;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input input:focus { border-color: #667eea; }
        .chat-input button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input button:hover:not(:disabled) { background: #5568d3; }
        .chat-input button:disabled { background: #c7c7cf; cursor: not-allowed; }
        .typing {
            display: inline-flex;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e5e5ea;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
        }
        .typing span {
            width: 8px; height: 8px;
            background: #c7c7cf;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .hint {
            padding: 10px 24px;
            background: #fff7ed;
            color: #9a3412;
            font-size: 13px;
            border-top: 1px solid #fed7aa;
        }
        /* 附件暂存区（输入框上方，显示已上传待发送的文件） */
        .attachments-tray {
            padding: 8px 20px;
            background: #f7f7fa;
            border-top: 1px solid #e5e5ea;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 120px;
            overflow-y: auto;
        }
        .attachments-tray:empty { display: none; }
        .attach-card {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            max-width: 220px;
        }
        .attach-card .icon {
            width: 18px; height: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        .attach-card .name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #1f2937;
        }
        .attach-card .remove {
            cursor: pointer;
            color: #9ca3af;
            font-size: 16px;
            line-height: 1;
            padding: 0 2px;
        }
        .attach-card .remove:hover { color: #ef4444; }
        .attach-card.uploading { opacity: 0.6; }
        .attach-card.uploading .remove { pointer-events: none; }
        .attach-card.error { border-color: #fecaca; background: #fef2f2; }
        /* + 按钮 */
        .plus-btn {
            width: 42px; height: 42px;
            border: 2px solid #e5e5ea;
            background: white;
            border-radius: 10px;
            font-size: 22px;
            color: #667eea;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .plus-btn:hover { border-color: #667eea; background: #f5f7ff; }
        .plus-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        /* 麦克风语音输入按钮 */
        .mic-btn {
            width: 42px; height: 42px;
            border: 2px solid #e5e5ea;
            background: white;
            border-radius: 10px;
            font-size: 19px;
            color: #667eea;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .mic-btn:hover:not(:disabled) { border-color: #667eea; background: #f5f7ff; }
        .mic-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        /* 录音中：红色脉冲状态 */
        .mic-btn.recording {
            border-color: #ef4444;
            background: #fef2f2;
            color: #ef4444;
            animation: mic-pulse 1.2s ease-in-out infinite;
        }
        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.35); }
            50% { box-shadow: 0 0 0 7px rgba(239,68,68,0); }
        }
        /* 用户消息里的附件展示 */
        .msg-attachments {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .msg-attach-link {
            font-size: 13px;
            color: #c7d2fe;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 6px;
            word-break: break-all;
        }
        .msg-attach-link:hover { background: rgba(255,255,255,0.25); }
        /* 顶部"文件列表"按钮 */
        .files-btn {
            margin-left: auto;
            background: rgba(255,255,255,0.18);
            color: white;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 8px;
            padding: 5px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .files-btn:hover { background: rgba(255,255,255,0.3); }
        .header-user { margin-left: auto; font-size: 13px; opacity: 0.9; }
        #filesBtn { margin-left: 12px; }
        #certsBtn { margin-left: 8px; }
        #logoutBtn { margin-left: 8px; }
        /* OSS 文件列表面板 */
        .files-panel {
            display: none;
            position: absolute;
            top: 60px;
            right: 12px;
            width: 340px;
            max-height: 65%;
            background: white;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.18);
            z-index: 20;
            flex-direction: column;
            overflow: hidden;
        }
        .files-panel.open { display: flex; }
        .files-panel-header {
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
            border-bottom: 1px solid #e5e5ea;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f9fafb;
        }
        .files-panel-header .refresh {
            margin-left: auto;
            border: none;
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .files-panel-header .refresh:hover { background: #e0e7ff; }
        .files-list {
            overflow-y: auto;
            padding: 6px;
            flex: 1;
        }
        .files-tip {
            padding: 18px 12px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
        }
        .file-item:hover { background: #f3f4f6; }
        .file-item .icon { flex-shrink: 0; }
        .file-item .info {
            flex: 1;
            min-width: 0;
        }
        .file-item .name {
            color: #1f2937;
            text-decoration: none;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-item .name:hover { color: #4f46e5; text-decoration: underline; }
        .file-item .sub {
            color: #9ca3af;
            font-size: 11px;
            margin-top: 2px;
        }
        .file-item .dl {
            flex-shrink: 0;
            color: #9ca3af;
            font-size: 15px;
            padding: 2px 6px;
            border-radius: 6px;
            text-decoration: none;
        }
        .file-item .dl:hover { color: #4f46e5; background: #e0e7ff; }
        .file-item .del {
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: #9ca3af;
            font-size: 15px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .file-item .del:hover { color: #ef4444; background: #fee2e2; }

        /* Redis 上下文记录 */
        .ctx-meta {
            padding: 8px 12px;
            font-size: 12px;
            color: #4b5563;
            background: #f9fafb;
            border-bottom: 1px solid #eef0f4;
            line-height: 1.7;
            word-break: break-all;
        }
        .ctx-meta b { color: #1f2937; }
        .ctx-round {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f1f5;
        }
        .ctx-round:hover { background: #fafbff; }
        .ctx-round .idx {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .ctx-round .q, .ctx-round .a {
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .ctx-round .q { color: #1d4ed8; margin-bottom: 5px; }
        .ctx-round .q::before { content: '🙋 问：'; font-weight: 600; }
        .ctx-round .a { color: #374151; }
        .ctx-round .a::before { content: '🤖 答：'; font-weight: 600; color: #059669; }
        .ctx-round .a.empty { color: #9ca3af; font-style: italic; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span class="dot"></span>
            <span>DeepSeek 结构化对话</span>
            <span class="header-user" title="当前登录用户">👤 {{ session.username }}</span>
            <button class="files-btn" id="filesBtn" title="查看 OSS 上已上传的文件">📁 文件列表</button>
            <button class="files-btn" id="ctxBtn" title="查看本会话在 Redis 中缓存的最近对话上下文">🧾 对话上下文</button>
            <button class="files-btn" id="certsBtn" title="管理数据库凭证">🔑 凭证管理</button>
            <button class="files-btn" id="logoutBtn" title="退出登录">退出</button>
        </div>
        <!-- OSS 文件列表面板（默认隐藏，点击右上角按钮展开） -->
        <div class="files-panel" id="filesPanel">
            <div class="files-panel-header">
                <span>OSS 已上传文件</span>
                <button class="refresh" id="filesRefresh">刷新</button>
            </div>
            <div class="files-list" id="filesList">
                <div class="files-tip">点击"刷新"加载文件...</div>
            </div>
        </div>
        <!-- Redis 对话上下文面板（默认隐藏，展示当前用户当前会话最近 5 轮问答） -->
        <div class="files-panel" id="ctxPanel">
            <div class="files-panel-header">
                <span>本会话对话上下文（Redis · 最近 5 轮）</span>
                <button class="refresh" id="ctxRefresh">刷新</button>
            </div>
            <div class="files-list" id="ctxList">
                <div class="files-tip">点击"刷新"加载上下文...</div>
            </div>
        </div>
        <div class="chat-messages" id="messages">
            <div class="msg ai">
                <div class="bubble">你好！我是基于 DeepSeek 的结构化对话助手。每条回复都会附带意图、置信度、关键词等结构化字段。随便问点什么试试吧。</div>
            </div>
        </div>
        <div class="attachments-tray" id="attachTray"></div>
        <div class="chat-input">
            <input type="file" id="fileInput" hidden multiple
                   accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,.pdf,.txt,.md,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv">
            <button class="plus-btn" id="plusBtn" onclick="fileInput.click()" title="上传文件到 OSS">+</button>
            <input type="text" id="input" placeholder="输入消息后回车发送..." autocomplete="off">
            <button class="mic-btn" id="micBtn" title="语音输入：点击开始录音，再点停止并识别（最长 60 秒）">🎤</button>
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const fileInput = document.getElementById('fileInput');
        const attachTray = document.getElementById('attachTray');
        const plusBtn = document.getElementById('plusBtn');

        // 待发送附件队列：{id, filename, url, size, status}
        let pendingAttachments = [];

        // 统一请求封装：登录失效（401）时自动跳转登录页
        async function apiFetch(url, options) {
            const resp = await fetch(url, options);
            if (resp.status === 401) {
                window.location.href = '/login';
                throw new Error('未登录或登录已过期');
            }
            return resp;
        }

        // 跳转凭证管理页
        document.getElementById('certsBtn').addEventListener('click', () => {
            window.location.href = '/certs';
        });

        // 退出登录
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try { await apiFetch('/api/logout', { method: 'POST' }); }
            catch (e) { /* 无论是否成功都跳登录页 */ }
            window.location.href = '/login';
        });

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
        });

        // ======== 麦克风语音输入（仅实时录音，不支持文件导入；最长 60 秒） ========
        const micBtn = document.getElementById('micBtn');
        const MIC_MAX_SECONDS = 60;
        let mediaRecorder = null;
        let micChunks = [];
        let micStream = null;
        let micTimer = null;
        let micSeconds = 0;
        let micMime = 'audio/webm';

        micBtn.addEventListener('click', toggleRecording);

        function setRecordingUI(on) {
            micBtn.classList.toggle('recording', on);
            micBtn.textContent = on ? '⏹' : '🎤';
            micBtn.title = on
                ? `录音中 ${micSeconds}s，点击停止并识别（最长 ${MIC_MAX_SECONDS} 秒）`
                : '语音输入：点击开始录音，再点停止并识别（最长 60 秒）';
            inputEl.placeholder = on
                ? `🎙 录音中 ${micSeconds} 秒，再次点击麦克风停止...`
                : '输入消息后回车发送...';
        }

        async function toggleRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();  // onstop 中统一收尾、上传
                return;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia ||
                typeof MediaRecorder === 'undefined') {
                alert('当前浏览器不支持麦克风录音，请使用最新版 Chrome / Edge / Safari');
                return;
            }
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (err) {
                if (err.name === 'NotAllowedError' || err.name === 'SecurityError') {
                    alert('麦克风权限被拒绝，请点击浏览器地址栏的权限图标允许使用麦克风后重试');
                } else if (err.name === 'NotFoundError') {
                    alert('未检测到麦克风设备');
                } else {
                    alert('无法打开麦克风：' + err.message);
                }
                return;
            }

            // Chrome/Edge 优先 webm/opus；Safari 用 mp4
            let options = {};
            if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                options.mimeType = 'audio/webm;codecs=opus';
                micMime = 'audio/webm';
            } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                options.mimeType = 'audio/mp4';
                micMime = 'audio/mp4';
            } else {
                micMime = MediaRecorder.isTypeSupported('audio/ogg') ? 'audio/ogg' : 'audio/webm';
            }

            micChunks = [];
            micSeconds = 0;
            try {
                mediaRecorder = new MediaRecorder(micStream, options);
            } catch (err) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
                alert('无法创建录音：' + err.message);
                return;
            }
            mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) micChunks.push(e.data); };
            mediaRecorder.onstop = onRecordingStop;
            mediaRecorder.start();
            setRecordingUI(true);
            micTimer = setInterval(() => {
                micSeconds++;
                setRecordingUI(true);
                if (micSeconds >= MIC_MAX_SECONDS && mediaRecorder &&
                    mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();  // 到 60 秒自动停止
                }
            }, 1000);
        }

        async function onRecordingStop() {
            clearInterval(micTimer);
            // 立即释放麦克风（指示灯熄灭）
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            setRecordingUI(false);

            const blob = new Blob(micChunks, { type: micMime });
            micChunks = [];
            if (blob.size < 800) {
                alert('录音时间太短，请按住麦克风多讲一会儿');
                return;
            }

            micBtn.disabled = true;
            inputEl.placeholder = '🎧 正在识别语音，请稍候...（首次使用服务器需加载语音模型）';
            try {
                const ext = micMime.includes('mp4') ? 'm4a'
                    : micMime.includes('ogg') ? 'ogg' : 'webm';
                const fd = new FormData();
                fd.append('audio', blob, 'recording.' + ext);
                const resp = await apiFetch('/api/transcribe', { method: 'POST', body: fd });
                const data = await resp.json();
                if (!resp.ok || data.error) throw new Error(data.error || '识别失败');
                if (data.text && data.text.trim()) {
                    // 识别结果填入输入框（保留原有文字，不自动发送，供用户确认/编辑）
                    inputEl.value = (inputEl.value ? inputEl.value + ' ' : '') + data.text.trim();
                    inputEl.focus();
                } else {
                    alert('没有识别到语音内容，请靠近麦克风、环境安静些再试');
                }
            } catch (err) {
                alert('语音识别失败：' + err.message);
            } finally {
                micBtn.disabled = false;
                inputEl.placeholder = '输入消息后回车发送...';
            }
        }

        // 文件选择 -> 上传
        const MAX_SIZE = 10 * 1024 * 1024; // 10MB，与后端一致
        fileInput.addEventListener('change', async () => {
            const files = Array.from(fileInput.files || []);
            fileInput.value = '';
            for (const f of files) {
                if (f.size > MAX_SIZE) {
                    alert(`文件 ${f.name} 超过 10MB，已跳过`);
                    continue;
                }
                await uploadFile(f);
            }
        });

        async function uploadFile(file) {
            const id = 'a' + Date.now() + Math.random().toString(36).slice(2, 6);
            const card = createAttachCard(id, file.name, file.size, 'uploading');
            attachTray.appendChild(card);
            const fd = new FormData();
            fd.append('file', file, file.name);
            try {
                const resp = await apiFetch('/api/upload', { method: 'POST', body: fd });
                const data = await resp.json();
                if (!resp.ok || data.error) {
                    throw new Error(data.error || '上传失败');
                }
                pendingAttachments.push({ id, filename: data.filename, url: data.url, size: data.size });
                markCardDone(id, data.url, false);
            } catch (err) {
                markCardError(id, err.message);
            }
        }

        function createAttachCard(id, name, size, status) {
            const card = document.createElement('div');
            card.className = 'attach-card' + (status === 'uploading' ? ' uploading' : '');
            card.dataset.id = id;
            const icon = document.createElement('span');
            icon.className = 'icon';
            icon.textContent = status === 'uploading' ? '⏳' : '📄';
            const nm = document.createElement('span');
            nm.className = 'name';
            nm.textContent = name + ' (' + formatSize(size) + ')';
            const rm = document.createElement('span');
            rm.className = 'remove';
            rm.textContent = '×';
            rm.onclick = () => removeAttachment(id);
            card.append(icon, nm, rm);
            return card;
        }

        function markCardDone(id, url, isError) {
            const card = attachTray.querySelector(`[data-id="${id}"]`);
            if (!card) return;
            card.classList.remove('uploading');
            card.querySelector('.icon').textContent = '📄';
        }

        function markCardError(id, msg) {
            const card = attachTray.querySelector(`[data-id="${id}"]`);
            if (!card) return;
            card.classList.add('error');
            card.classList.remove('uploading');
            card.querySelector('.icon').textContent = '⚠';
            card.querySelector('.name').textContent = msg;
        }

        function removeAttachment(id) {
            const card = attachTray.querySelector(`[data-id="${id}"]`);
            if (card) card.remove();
            pendingAttachments = pendingAttachments.filter(a => a.id !== id);
        }

        function formatSize(n) {
            if (n < 1024) return n + 'B';
            if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'KB';
            return (n / 1024 / 1024).toFixed(1) + 'MB';
        }

        // ======== OSS 文件列表 / 删除 ========
        const filesBtn = document.getElementById('filesBtn');
        const filesPanel = document.getElementById('filesPanel');
        const filesList = document.getElementById('filesList');
        const filesRefresh = document.getElementById('filesRefresh');

        filesBtn.addEventListener('click', () => {
            const opening = !filesPanel.classList.contains('open');
            ctxPanel.classList.remove('open');  // 与上下文面板互斥，避免重叠
            filesPanel.classList.toggle('open');
            if (opening) loadFiles();  // 每次展开时自动加载一次
        });
        filesRefresh.addEventListener('click', loadFiles);

        async function loadFiles() {
            filesList.innerHTML = '<div class="files-tip">加载中...</div>';
            try {
                const resp = await apiFetch('/api/files');
                const data = await resp.json();
                if (!resp.ok || data.error) throw new Error(data.error || '加载失败');
                renderFiles(data.files || []);
            } catch (err) {
                filesList.innerHTML = '<div class="files-tip">⚠ ' + err.message + '</div>';
            }
        }

        function formatTime(ts) {
            const d = new Date(ts * 1000);
            const p = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
        }

        function renderFiles(files) {
            filesList.innerHTML = '';
            if (!files.length) {
                filesList.innerHTML = '<div class="files-tip">暂无文件，点击左下角 + 上传</div>';
                return;
            }
            for (const f of files) {
                const item = document.createElement('div');
                item.className = 'file-item';

                const icon = document.createElement('span');
                icon.className = 'icon';
                icon.textContent = '📄';

                const info = document.createElement('div');
                info.className = 'info';
                const link = document.createElement('a');
                link.className = 'name';
                link.href = f.url;
                link.target = '_blank';
                link.title = f.object_key;
                link.textContent = f.filename;
                const sub = document.createElement('div');
                sub.className = 'sub';
                sub.textContent = formatSize(f.size) + ' · ' + formatTime(f.last_modified);
                info.append(link, sub);

                const dl = document.createElement('a');
                dl.className = 'dl';
                dl.href = f.download_url;
                dl.textContent = '⬇';
                dl.title = '下载该文件';
                dl.setAttribute('download', f.filename);  // 提示浏览器存为原始文件名

                const del = document.createElement('button');
                del.className = 'del';
                del.textContent = '🗑';
                del.title = '删除该文件';
                del.onclick = () => deleteFile(f, item);

                item.append(icon, info, dl, del);
                filesList.appendChild(item);
            }
        }

        async function deleteFile(file, itemEl) {
            if (!confirm(`确定从 OSS 删除文件 "${file.filename}" 吗？此操作不可恢复。`)) return;
            const delBtn = itemEl.querySelector('.del');
            delBtn.disabled = true;
            delBtn.textContent = '...';
            try {
                const resp = await apiFetch('/api/files', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ object_key: file.object_key })
                });
                const data = await resp.json();
                if (!resp.ok || data.error) throw new Error(data.error || '删除失败');
                itemEl.remove();  // 从列表中移除
                if (!filesList.children.length) {
                    filesList.innerHTML = '<div class="files-tip">暂无文件，点击左下角 + 上传</div>';
                }
            } catch (err) {
                alert('删除失败: ' + err.message);
                delBtn.disabled = false;
                delBtn.textContent = '🗑';
            }
        }

        // ======== Redis 对话上下文查看（当前用户 / 当前 session 最近 5 轮） ========
        const ctxBtn = document.getElementById('ctxBtn');
        const ctxPanel = document.getElementById('ctxPanel');
        const ctxList = document.getElementById('ctxList');
        const ctxRefresh = document.getElementById('ctxRefresh');

        ctxBtn.addEventListener('click', () => {
            const opening = !ctxPanel.classList.contains('open');
            filesPanel.classList.remove('open');  // 与文件面板互斥
            ctxPanel.classList.toggle('open');
            if (opening) loadContext();  // 每次展开时自动加载
        });
        ctxRefresh.addEventListener('click', loadContext);

        function fmtTTL(sec) {
            if (!sec || sec <= 0) return '即将过期/无';
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return m > 0 ? `${m} 分 ${s} 秒` : `${s} 秒`;
        }

        async function loadContext() {
            ctxList.innerHTML = '<div class="files-tip">加载中...</div>';
            try {
                const resp = await apiFetch('/api/context');
                const data = await resp.json();
                if (!resp.ok || data.error) throw new Error(data.error || '加载失败');
                renderContext(data);
            } catch (err) {
                ctxList.innerHTML = '<div class="files-tip">⚠ ' + err.message + '</div>';
            }
        }

        function esc(s) {
            return String(s == null ? '' : s);
        }

        function renderContext(data) {
            ctxList.innerHTML = '';
            if (data.available === false) {
                ctxList.innerHTML = `<div class="files-tip">⚠ ${esc(data.message || 'Redis 不可用')}</div>`;
                return;
            }

            // 头部元信息：用户、session、key、TTL、条数
            const meta = document.createElement('div');
            meta.className = 'ctx-meta';
            meta.innerHTML =
                `<div><b>用户：</b>${esc(data.username)}</div>` +
                `<div><b>Session：</b>${esc((data.sid || '').slice(0, 16))}…</div>` +
                `<div><b>Key：</b>${esc(data.redis_key)}</div>` +
                `<div><b>剩余有效期：</b>${fmtTTL(data.ttl_seconds)}（每次对话滑动续期 1 小时）</div>` +
                `<div><b>记录：</b>${data.total || 0} / ${data.max_rounds} 轮（仅当前会话可见）</div>`;
            ctxList.appendChild(meta);

            const rounds = data.rounds || [];
            if (!rounds.length) {
                const tip = document.createElement('div');
                tip.className = 'files-tip';
                tip.textContent = '本会话还没有对话记录，发送一条消息后再来查看';
                ctxList.appendChild(tip);
                return;
            }
            for (const rd of rounds) {
                const box = document.createElement('div');
                box.className = 'ctx-round';

                const idx = document.createElement('div');
                idx.className = 'idx';
                idx.textContent = `第 ${rd.index} 轮`;

                const q = document.createElement('div');
                q.className = 'q';
                q.textContent = esc(rd.question);

                const a = document.createElement('div');
                a.className = 'a' + (rd.answer ? '' : ' empty');
                a.textContent = rd.answer ? esc(rd.answer) : '（本轮暂无回答）';

                box.append(idx, q, a);
                ctxList.appendChild(box);
            }
        }

        function appendUserMsg(text, attachments) {
            const div = document.createElement('div');
            div.className = 'msg user';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text || '(仅附件)';
            div.appendChild(bubble);
            if (attachments && attachments.length) {
                const wrap = document.createElement('div');
                wrap.className = 'msg-attachments';
                for (const a of attachments) {
                    const link = document.createElement('a');
                    link.className = 'msg-attach-link';
                    link.href = a.url;
                    link.target = '_blank';
                    link.textContent = '📎 ' + a.filename;
                    wrap.appendChild(link);
                }
                div.appendChild(wrap);
            }
            messagesEl.appendChild(div);
            scrollBottom();
        }

        function appendAiMsg(data, rawText) {
            const div = document.createElement('div');
            div.className = 'msg ai';

            // 主体回复气泡
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = data.reply || '(空回复)';
            div.appendChild(bubble);

            // 结构化元信息标签
            const meta = document.createElement('div');
            meta.className = 'meta';
            if (data.intent) {
                const t = document.createElement('span');
                t.className = 'tag intent';
                t.textContent = '意图: ' + data.intent;
                meta.appendChild(t);
            }
            if (typeof data.confidence === 'number') {
                const t = document.createElement('span');
                t.className = 'tag confidence';
                t.textContent = '置信度: ' + data.confidence.toFixed(2);
                meta.appendChild(t);
            }
            if (Array.isArray(data.keywords) && data.keywords.length) {
                const t = document.createElement('span');
                t.className = 'tag keywords';
                t.textContent = '关键词: ' + data.keywords.join(', ');
                meta.appendChild(t);
            }
            if (meta.children.length) div.appendChild(meta);

            // 错误标签
            if (data.error) {
                const t = document.createElement('span');
                t.className = 'tag error';
                t.textContent = '错误: ' + data.error;
                meta.appendChild(t);
            }

            // 可折叠的原始 JSON
            if (rawText) {
                const raw = document.createElement('div');
                raw.className = 'raw-json';
                raw.textContent = rawText;
                raw.style.cursor = 'pointer';
                raw.title = '点击折叠/展开';
                let expanded = true;
                raw.addEventListener('click', () => {
                    expanded = !expanded;
                    raw.style.maxHeight = expanded ? '120px' : '20px';
                });
                div.appendChild(raw);
            }

            messagesEl.appendChild(div);
            scrollBottom();
        }

        function appendTyping() {
            const div = document.createElement('div');
            div.className = 'msg ai';
            div.id = 'typing-msg';
            div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            messagesEl.appendChild(div);
            scrollBottom();
        }
        function removeTyping() {
            const t = document.getElementById('typing-msg');
            if (t) t.remove();
        }

        function scrollBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            // 检查是否有正在上传的附件
            const uploading = attachTray.querySelector('.attach-card.uploading');
            if (uploading) { alert('有文件正在上传，请稍候...'); return; }
            const attachments = pendingAttachments.slice();
            if (!text && attachments.length === 0) return;

            appendUserMsg(text, attachments);
            inputEl.value = '';
            // 清空待发送附件区
            pendingAttachments = [];
            attachTray.innerHTML = '';
            sendBtn.disabled = true;
            appendTyping();

            try {
                const resp = await apiFetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        attachments: attachments.map(a => ({ filename: a.filename, url: a.url, size: a.size }))
                    })
                });
                const data = await resp.json();
                removeTyping();
                appendAiMsg(data, JSON.stringify(data, null, 2));
            } catch (err) {
                removeTyping();
                appendAiMsg({ reply: '请求失败', error: err.message }, null);
            } finally {
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        inputEl.focus();
    </script>
</body>
</html>
