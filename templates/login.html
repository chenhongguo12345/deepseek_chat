<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - DeepSeek 结构化对话</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 26px 28px;
        }
        .login-header h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .login-header .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #4ade80; box-shadow: 0 0 8px #4ade80;
        }
        .login-header p { font-size: 13px; opacity: 0.85; margin-top: 6px; }
        .login-body { padding: 28px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-size: 13px; color: #555;
            margin-bottom: 6px; font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e5ee;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 6px;
        }
        .login-btn:hover { opacity: 0.92; }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.show { display: block; }
        .login-tip {
            text-align: center; font-size: 12px; color: #999;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1><span class="dot"></span>DeepSeek 结构化对话</h1>
            <p>请登录后使用</p>
        </div>
        <div class="login-body">
            <div class="error-msg" id="errorMsg"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" autocomplete="username"
                           placeholder="请输入用户名" autofocus required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" autocomplete="current-password"
                           placeholder="请输入密码" required>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">登 录</button>
            </form>
            <div class="login-tip">默认管理员 admin / admin123，登录后请及时修改密码</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('show');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();
                if (resp.ok && data.ok) {
                    // 登录成功，跳转主页
                    window.location.href = '/';
                } else {
                    showError(data.error || '登录失败');
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登 录';
                }
            } catch (err) {
                showError('网络异常，请稍后重试');
                loginBtn.disabled = false;
                loginBtn.textContent = '登 录';
            }
        });
    </script>
</body>
</html>
