<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - DeepSeek 结构化对话</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 26px 28px;
        }
        .login-header h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .login-header .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #4ade80; box-shadow: 0 0 8px #4ade80;
        }
        .login-header p { font-size: 13px; opacity: 0.85; margin-top: 6px; }
        .login-body { padding: 28px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-size: 13px; color: #555;
            margin-bottom: 6px; font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e5ee;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .login-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .login-btn:hover { opacity: 0.92; }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        /* 与登录并列的次要按钮（注册 / 返回登录） */
        .secondary-btn {
            flex: 1;
            padding: 12px;
            border: 1.5px solid #667eea;
            border-radius: 10px;
            background: #fff;
            color: #667eea;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .secondary-btn:hover { background: #f0f2ff; }
        .secondary-btn:active { transform: scale(0.98); }
        .btn-row { display: flex; gap: 12px; margin-top: 6px; }
        .success-msg {
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .success-msg.show { display: block; }
        .error-msg {
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.show { display: block; }
        .login-tip {
            text-align: center; font-size: 12px; color: #999;
            margin-top: 16px;
        }
        .migrate-area {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px dashed #e2e5ee;
            text-align: center;
        }
        .migrate-btn {
            background: #fff;
            color: #667eea;
            border: 1.5px solid #667eea;
            border-radius: 8px;
            padding: 7px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .migrate-btn:hover { background: #f0f2ff; }
        .migrate-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .migrate-result {
            display: none;
            margin-top: 10px;
            font-size: 12px;
            border-radius: 8px;
            padding: 9px 12px;
            text-align: left;
            line-height: 1.6;
        }
        .migrate-result.ok { display: block; background: #dcfce7; color: #166534; }
        .migrate-result.fail { display: block; background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1><span class="dot"></span>DeepSeek 结构化对话</h1>
            <p id="subtitle">请登录后使用</p>
        </div>
        <div class="login-body">
            <div class="success-msg" id="successMsg"></div>
            <div class="error-msg" id="errorMsg"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" autocomplete="username"
                           placeholder="请输入用户名（3-64 个字符）" autofocus required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" autocomplete="current-password"
                           placeholder="请输入密码（至少 6 位）" required>
                </div>
                <div class="btn-row">
                    <button type="submit" class="login-btn" id="submitBtn">登 录</button>
                    <button type="button" class="secondary-btn" id="switchBtn">注 册</button>
                </div>
            </form>
            <div class="login-tip">默认管理员 admin / admin123，登录后请及时修改密码</div>
            <div class="migrate-area">
                <button type="button" class="migrate-btn" id="migrateBtn">将 MySQL 数据导入 PostgreSQL</button>
                <div class="migrate-result" id="migrateResult"></div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const submitBtn = document.getElementById('submitBtn');
        const switchBtn = document.getElementById('switchBtn');
        const subtitle = document.getElementById('subtitle');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        // login = 登录模式（提交登录、并列显示注册按钮）；register = 注册模式（提交注册、并列显示返回登录）
        let mode = 'login';

        function showError(msg) {
            successMsg.classList.remove('show');
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
        }
        function showSuccess(msg) {
            errorMsg.classList.remove('show');
            successMsg.textContent = msg;
            successMsg.classList.add('show');
        }
        function hideMsgs() {
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        }

        // 切换登录 / 注册表单
        function switchMode(target) {
            mode = target;
            hideMsgs();
            passwordInput.value = '';
            if (mode === 'register') {
                subtitle.textContent = '注册新账号';
                submitBtn.textContent = '提交注册';
                switchBtn.textContent = '返回登录';
                usernameInput.focus();
            } else {
                subtitle.textContent = '请登录后使用';
                submitBtn.textContent = '登 录';
                switchBtn.textContent = '注 册';
                usernameInput.focus();
            }
        }
        switchBtn.addEventListener('click', () => {
            switchMode(mode === 'login' ? 'register' : 'login');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMsgs();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = mode === 'login' ? '登录中...' : '注册中...';
            try {
                const url = mode === 'login' ? '/api/login' : '/api/register';
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();
                if (resp.ok && data.ok) {
                    if (mode === 'login') {
                        // 登录成功，跳转主页
                        window.location.href = '/';
                        return;
                    }
                    // 注册成功：切回登录模式，预填用户名，等待登录
                    switchMode('login');
                    showSuccess(`注册成功！用户「${data.username}」已创建，请使用新账号登录`);
                    passwordInput.value = '';
                } else {
                    // 注册时用户名冲突等错误：后端返回“添加失败：用户名已存在”
                    showError(data.error || (mode === 'login' ? '登录失败' : '添加失败'));
                }
            } catch (err) {
                showError('网络异常，请稍后重试');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = mode === 'login' ? '登 录' : '提交注册';
            }
        });

        // MySQL -> PostgreSQL 数据迁移（会清空 PG 目标表后全量复制，需要二次确认）
        const migrateBtn = document.getElementById('migrateBtn');
        const migrateResult = document.getElementById('migrateResult');
        migrateBtn.addEventListener('click', async () => {
            if (!confirm('确定把 MySQL 的数据导入 PostgreSQL 吗？\n\n'
                + '· PostgreSQL 中不存在的数据库和表会自动创建（库名/表名/字段与 MySQL 一致）\n'
                + '· 已存在的目标表会被【清空】后全量复制 MySQL 当前数据\n'
                + '· MySQL 数据不会被修改')) return;
            migrateBtn.disabled = true;
            migrateBtn.textContent = '迁移中...';
            migrateResult.className = 'migrate-result';
            migrateResult.textContent = '';
            try {
                const resp = await fetch('/api/migrate/mysql-to-pg', { method: 'POST' });
                const data = await resp.json();
                if (resp.ok && data.ok) {
                    const r = data.report;
                    const lines = Object.entries(r.tables)
                        .map(([t, n]) => `· ${t}：${n} 行`).join('<br>');
                    migrateResult.className = 'migrate-result ok';
                    migrateResult.innerHTML =
                        `迁移成功${r.database_created ? '（已新建数据库）' : ''}：<br>${lines}`
                        + '<br>之后请将 .env 中 DATABASE_SEL 设为 pgsql 并重启服务。';
                } else {
                    migrateResult.className = 'migrate-result fail';
                    migrateResult.textContent = data.error || '迁移失败';
                }
            } catch (err) {
                migrateResult.className = 'migrate-result fail';
                migrateResult.textContent = '网络异常，迁移失败';
            } finally {
                migrateBtn.disabled = false;
                migrateBtn.textContent = '将 MySQL 数据导入 PostgreSQL';
            }
        });
    </script>
</body>
</html>
